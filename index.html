<main class="DragDrop-Section">
    <div id="dropZone" class="dropZone eins">Schiffe hier ablegen</div>
    <div id="dropZone" class="dropZone zwei">Schiffe hier ablegen</div>
    <div id="dropZone" class="dropZone drei">Schiffe hier ablegen</div>
    <div id="dropZone" class="dropZone vier">Schiffe hier ablegen</div>

    <div id="shipBank">
        <div id="shipTemplate" class="ship" draggable="true">Schiff</div>
    </div>
</main>
<img class="BootSteg" src="assets/StegBoot.png" alt="">
<section class="Information-Section">
    <div class="Information-Section--Caption">
        <h1>WILKOMMEN</h1>
        <hr>
    </div>
    <div class="Information-Section--legend">
        <span>Informationen zu den Anlegeplätzen</span>
        <ul class="Information-legend">
            <li>
                <span class="color-legend red">
                </span>
                <span class="legend-explanation">Gesperrter Anlegeplatz</span>
            </li>
            <li>
                <span class="color-legend blue">
                </span>
                <span class="legend-explanation">Belegter Anlegeplatz</span>
            </li>
            <li>
                <span class="color-legend orange">
                </span>
                <span class="legend-explanation">Vermieteter Anlegeplatz</span>
            </li>
            <li>
                <span class="color-legend green">
                </span>
                <span class="legend-explanation">Verfügbarer Anlegeplatz</span>
            </li>
        </ul>
    </div>
    <section class="weather-section">
        <div class="weather-container">
            <div class="forecast-container" id="forecast"></div>
        </div>
    </section>
    
    <script>
        const API_KEY = '80806bf5d1156ce58103521021c3b87f';
        const forecastContainer = document.getElementById('forecast');

        // Wochentage auf Deutsch
        const weekdays = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];

        async function getWeatherForecast(lat, lon) {
            try {
                const response = await fetch(
                    `https://api.openweathermap.org/data/2.5/forecast?lat=${lat}&lon=${lon}&appid=${API_KEY}&units=metric&lang=de`
                );

                if (!response.ok) throw new Error(`HTTP Fehler: ${response.status}`);

                const data = await response.json();
                console.log('Forecast Data:', data);

                // Gruppiere die Daten pro Tag (8 Messungen pro Tag)
                const dailyData = data.list.filter((item, index) => index % 8 === 0);

                forecastContainer.innerHTML = dailyData.slice(0, 5).map(item => {
                    const date = new Date(item.dt * 1000);
                    return `
                    <div class="forecast-day">
                        <div class="forecast-date">${weekdays[date.getDay()]}</div>
                        <img class="forecast-icon" src="https://openweathermap.org/img/wn/${item.weather[0].icon}.png">
                        <div class="forecast-temp">${Math.round(item.main.temp)}°C</div>
                        <div class="weather-description">${item.weather[0].description}</div>
                    </div>
                `;
                }).join('');

            } catch (error) {
                console.error('Fehler:', error);
                forecastContainer.innerHTML = `<p class="error">Vorhersage nicht verfügbar: ${error.message}</p>`;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    const lat = position.coords.latitude.toFixed(4);
                    const lon = position.coords.longitude.toFixed(4);
                    getWeatherForecast(lat, lon);
                });
            }
        });

        let shipsOut = 0;
            const maxShips = 16;
            let draggedElement = null;

            const shipTemplate = document.getElementById('shipTemplate');
            const shipBank = document.getElementById('shipBank');
            const dropZones = document.querySelectorAll('.dropZone');

            // Funktion zum Hinzufügen von Drag-Events an Schiff-Klone
            function addCloneDragEvents(clone) {
                clone.addEventListener('dragstart', function (event) {
                    event.dataTransfer.setData("text/plain", "shipClone");
                    draggedElement = clone;
                });
                clone.addEventListener('dragend', function (event) {
                    draggedElement = null;
                });
            }

            // Beim Dragstart der Schiff-Vorlage aus der Bank wird geprüft, ob noch Platz ist.
            shipTemplate.addEventListener('dragstart', function (event) {
                if (shipsOut >= maxShips) {
                    event.preventDefault();
                    alert("Maximale Anzahl von 16 Schiffen erreicht! Bitte lege ein Schiff zurück.");
                    return;
                }
                event.dataTransfer.setData("text/plain", "ship");
            });

            // Initialisiert eine DropZone mit den nötigen Event-Listenern
            function initDropZone(zone) {
                zone.addEventListener('dragover', function (event) {
                    event.preventDefault();
                });

                zone.addEventListener('drop', function (event) {
                    event.preventDefault();
                    const data = event.dataTransfer.getData("text/plain");

                    if (data === "ship") {
                        // Neues Schiff aus der Bank: nur hinzufügen, wenn Limit noch nicht erreicht ist.
                        if (shipsOut < maxShips) {
                            const shipClone = shipTemplate.cloneNode(true);
                            shipClone.removeAttribute("id"); // ID entfernen, um Duplikate zu vermeiden
                            addCloneDragEvents(shipClone);
                            zone.appendChild(shipClone);
                            shipsOut++;
                        } else {
                            alert("Maximale Anzahl von 16 Schiffen erreicht!");
                        }
                    } else if (data === "shipClone") {
                        // Schiff-Klon zwischen DropZones verschieben (Reparenting)
                        if (draggedElement && draggedElement.parentNode !== zone) {
                            zone.appendChild(draggedElement);
                        }
                    }
                });
            }

            // Initialisiere alle DropZones
            dropZones.forEach(zone => initDropZone(zone));

            // Schiff-Bank nimmt auch Schiff-Klone zurück
            shipBank.addEventListener('dragover', function (event) {
                event.preventDefault();
            });

            shipBank.addEventListener('drop', function (event) {
                event.preventDefault();
                const data = event.dataTransfer.getData("text/plain");
                if (data === "shipClone" && draggedElement) {
                    if (draggedElement.parentNode) {
                        draggedElement.parentNode.removeChild(draggedElement);
                        shipsOut--;
                        draggedElement = null;
                    }
                }
            });
    </script>
</section>
